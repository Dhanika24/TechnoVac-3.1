<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Card</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        margin-top: 60px;
      }
      .card {
        display: inline-block;
        padding: 24px 40px;
        border: 2px solid #6b46c1;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>YOUR NAME</h1>
      <p>GitHub: @YOUR-USERNAME</p>
      <p>Favorite language: YOUR LANGUAGE</p>
      <p>Fun fact: YOUR FUN FACT</p>
    </div>
  </body>
</html>
